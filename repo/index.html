<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云中霞光 - 项目</title>
  <meta name="description" content="Nimbulux_ 的全部项目列表">
  <script src="/app/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/app/assets/css/common.css">
  <link rel="stylesheet" href="/app/assets/css/repo.css">
  <link rel="icon" type="image/jpeg" href="/public/favicon.jpg">
  <link rel="canonical" href="https://nimbulux.github.io/repo/">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container wide">
    <div class="section-title">
      <div class="title-left">
        <span>全部项目</span>
        <div id="repo-search"></div>
      </div>
      <a class="more-link" href="/app/">« 返回首页</a>
    </div>

    <div id="all-projects">
      <!-- 项目卡片挂载点（自适应网格） -->
    </div>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> Nimbulux_ · Powered by GitHub Pages
  </footer>

  <script src="/app/assets/js/common.js"></script>
  <script src="/app/assets/js/repo.js"></script>
  <script src="/app/assets/vendor/vue.global.js"></script>
  <script>
    /* 全部项目：从 /repo/RepoList.json 加载，复用首页卡片设计，每行 2 个；
       简介 / star / 技术栈由 GitHub API enrich；
       搜索框对 name / id / 简介 / 技术栈实时过滤 */
    var repoGridCtrl = null;
    fetchRepoList().then(function (list) {
      repoGridCtrl = mountProjectGrid("#all-projects", list, 2);
      mountSearchBox("#repo-search", {
        placeholder: "搜索项目…",
        onQuery: function (q) { if (repoGridCtrl) repoGridCtrl.setQuery(q); }
      });
    });
  </script>
</body>
</html>
