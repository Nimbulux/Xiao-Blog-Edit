<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云中霞光 - 文档</title>
  <meta name="description" content="Nimbulux_ 的 文档库目录">
  <script src="/app/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/app/assets/css/common.css">
  <link rel="stylesheet" href="/app/assets/css/docs.css">
  <link rel="icon" type="image/jpeg" href="/public/favicon.jpg">
  <link rel="canonical" href="https://nimbulux.github.io/docs/">
  <meta property="og:site_name" content="Nimbulux_">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="Nimbulux_ - 好友">
  <meta property="og:description" content="Nimbulux_ 的好友列表">
  <meta property="og:url" content="https://nimbulux.github.io/app/friend/">
  <meta property="og:image" content="/public/favicon.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Nimbulux_ - 好友">
  <meta name="twitter:description" content="Nimbulux_ 的好友列表">
  <meta name="twitter:image" content="/public/favicon.jpg">
</head>
<body>
  <header id="site-nav"></header>

  <div class="docs-layout">
    <!-- 左侧目录侧边栏 -->
    <aside id="docs-sidebar" class="docs-sidebar">
      <h3>目录</h3>
      <div class="status-box">加载中…</div>
    </aside>

    <!-- 右侧内容 -->
    <section class="docs-content">
      <div class="docs-head-row">
        <h1>文档知识库</h1>
        <div id="docs-search"></div>
      </div>
      <p>一堆文章...</p>

      <div class="section-title" style="margin-top: 24px;">
        <span>全部文章</span>
      </div>
      <div id="docs-index-list" class="docs-index-list">
        <div class="status-box">加载中...</div>
      </div>
    </section>
  </div>

  <footer class="site-footer">
    © <span id="year"></span> Nimbulux_ · Powered by GitHub Pages
  </footer>

  <script src="/app/assets/js/common.js"></script>
  <script src="/app/assets/js/docs-core.js"></script>
  <script>
    /* 渲染左侧侧边栏（目录页无当前文章） */
    renderSidebar(null);

    /* 渲染右侧文章列表（仅一级：有子章节的跳第一个叶子，否则跳自身）；
       搜索框对标题 / id 实时过滤 */
    var allDocs = [];

    function matchDoc(item, q) {
      if (!q) return true;
      var fields = [nodeTitle(item), nodePath(item)];   // ← 用 nodeTitle/nodePath
      for (var i = 0; i < fields.length; i++) {
        if (fields[i] && String(fields[i]).toLowerCase().indexOf(q) !== -1) return true;
      }
      return false;
    }

    function renderDocsIndex(list, hasQuery) {
      var box = document.getElementById("docs-index-list");
      if (!list.length) {
        box.innerHTML = '<div class="status-box">' +
          (hasQuery ? "未找到匹配的文章。" : "暂无文章。") + "</div>";
        return;
      }
      box.innerHTML = list.map(function (item) {
        var relPath = nodePath(item);                       // ← 用 core 暴露的工具
        var href = (item.children && item.children.length)
          ? docHref(firstLeafPath(item))                    // ← 直接拿叶子路径
          : docHref(relPath);

        return '<a class="doc-item" href="' + href + '">' +
          '<span class="doc-title">' + Utils.escapeHTML(nodeTitle(item)) + "</span>" +
          '<span class="doc-arrow">→</span>' +
        "</a>";
      }).join("");
    }

    fetchDocsList().then(function (list) {
      allDocs = list;
      renderDocsIndex(allDocs, false);
      mountSearchBox("#docs-search", {
        placeholder: "搜索文章…",
        onQuery: function (q) {
          renderDocsIndex(allDocs.filter(function (it) { return matchDoc(it, q); }), !!q);
        }
      });
    });
  </script>
</body>
</html>
